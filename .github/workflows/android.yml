name: Android CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Gradle 6.9 and Android Gradle Plugin 4.2.1 use Java 11.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Match the minimum toolchain used by rclone v1.75.2.
      - name: Set up Go 1.26.9
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: false

      - name: Install Android SDK 30 and NDK r28c
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-30" "ndk;28.2.13676358"

      - name: Build rclone for Android
        run: ./gradlew rclone:buildNative --stacktrace

      - name: Check native binaries
        run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/lib/$abi/librclone.so"
            file "app/lib/$abi/librclone.so"
          done

      - name: Run Java unit tests
        run: ./gradlew testOssDebugUnitTest --stacktrace

      - name: Build OSS debug APKs
        run: ./gradlew assembleOssDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: rcx-rclone-1.75.2-debug
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
