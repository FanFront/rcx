// Build pinned rclone source for Android using Go modules.
// Requires Go 1.26.9 or later and Android NDK r28c (28.2.13676358).
// Run: ./gradlew rclone:buildNative
//
// Android packages our executable under nativeLibraryDir as librclone.so.

import java.nio.file.Files
import java.nio.file.Paths
import java.util.Properties

def buildTag = 'v1.75.2'
ext.ndkVersion = '28.2.13676358'
def repositoryUrl = 'https://github.com/rclone/rclone.git'
def sourceDir = file(buildDir.toString() + '/rclone-' + buildTag)
def appLibPath = file(projectDir.toString() + '/../app/lib')
def goBinary = Files.exists(Paths.get('golang/go/bin/go')) ? 'golang/go/bin/go' : 'go'
def ldflags = '-s -w -X github.com/rclone/rclone/fs.Version=' + buildTag + '-rcx'

def checkNdk(path) {
    def propertiesFile = path.resolve('source.properties')
    if (!Files.isRegularFile(propertiesFile)) {
        return false
    }
    def properties = new Properties()
    propertiesFile.toFile().withInputStream { properties.load(it) }
    return properties.getProperty('Pkg.Revision') == ext.ndkVersion
}

def configureNdk() {
    def osName = System.properties['os.name'].toLowerCase()
    def host = osName.contains('windows') ? 'windows-x86_64' :
            osName.contains('linux') ? 'linux-x86_64' :
            osName.contains('mac') ? 'darwin-x86_64' : null
    if (host == null) {
        throw new GradleException('Unsupported host: ' + osName)
    }

    def candidates = []
    [System.getenv('ANDROID_HOME'), System.getenv('ANDROID_SDK_ROOT')].each { home ->
        if (home) {
            candidates.add(Paths.get(home, 'ndk', ext.ndkVersion))
            candidates.add(Paths.get(home, 'ndk-bundle'))
        }
    }
    if (System.getenv('ANDROID_NDK_HOME')) {
        candidates.add(Paths.get(System.getenv('ANDROID_NDK_HOME')))
    }
    def ndk = candidates.find { checkNdk(it) }
    if (ndk == null) {
        throw new GradleException('Android NDK ' + ext.ndkVersion +
                ' not found. Install it using sdkmanager.')
    }
    return ndk.resolve(Paths.get('toolchains', 'llvm', 'prebuilt', host, 'bin'))
}

task fetchRclone(type: Exec) {
    // Version-specific checkout prevents compiling a stale release.
    onlyIf { !file(sourceDir.toString() + '/go.mod').isFile() }
    doFirst {
        sourceDir.parentFile.mkdirs()
        if (sourceDir.exists()) {
            delete sourceDir
        }
    }
    commandLine 'git', 'clone', '--depth', '1', '--single-branch',
            '--branch', buildTag, repositoryUrl, sourceDir.absolutePath
}

def registerNativeBuild = { taskName, abi, goArch, clang, goArm ->
    tasks.create(taskName, Exec) {
        dependsOn fetchRclone
        def outputFile = file(appLibPath.toString() + '/' + abi + '/librclone.so')
        inputs.property('rcloneVersion', buildTag)
        outputs.file(outputFile)
        workingDir sourceDir
        commandLine goBinary, 'build', '-v', '-tags', 'android,noselfupdate',
                '-trimpath', '-ldflags', ldflags, '-o', outputFile.absolutePath, '.'
        doFirst {
            outputFile.parentFile.mkdirs()
            def cc = configureNdk().resolve(clang).toString()
            environment 'CC', cc
            environment 'CC_FOR_TARGET', cc
            environment 'GOOS', 'android'
            environment 'GOARCH', goArch
            environment 'CGO_ENABLED', '1'
            environment 'CGO_LDFLAGS', '-fuse-ld=lld -s -w'
            environment 'GOTOOLCHAIN', 'auto'
            if (goArm != null) {
                environment 'GOARM', goArm
            }
        }
    }
}

// Clang API 21 corresponds to app minSdkVersion.
registerNativeBuild('buildArm', 'armeabi-v7a', 'arm',
        'armv7a-linux-androideabi21-clang', '7')
registerNativeBuild('buildArm64', 'arm64-v8a', 'arm64',
        'aarch64-linux-android21-clang', null)
registerNativeBuild('buildx86', 'x86', '386',
        'i686-linux-android21-clang', null)
registerNativeBuild('buildx64', 'x86_64', 'amd64',
        'x86_64-linux-android21-clang', null)

task buildNative {
    dependsOn buildArm, buildArm64, buildx86, buildx64
}

task cleanNative {
    doLast {
        delete file(appLibPath.toString() + '/armeabi-v7a/librclone.so')
        delete file(appLibPath.toString() + '/arm64-v8a/librclone.so')
        delete file(appLibPath.toString() + '/x86/librclone.so')
        delete file(appLibPath.toString() + '/x86_64/librclone.so')
    }
}
defaultTasks 'buildNative'
